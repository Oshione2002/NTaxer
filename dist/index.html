<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NTaxer · Nigeria tax calculator</title>
  <meta name="description" content="Calculate Nigerian personal, business and transaction taxes. Explore the Nigeria Tax Act 2025, see calculation breakdowns and check legal sources.">
  <meta name="theme-color" content="#073e32">
  <link rel="icon" href="assets/icon.png" type="image/png"><link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to calculator</a>
  <header class="topbar">
    <a class="brand" href="#calculator/paye"><img src="assets/icon.png" width="40" height="40" alt=""><span>NTaxer<span class="brand-period">.</span></span></a>
  </header>
  <div class="shell">
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="tax-sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></button>
    <aside id="tax-sidebar" class="sidebar" aria-label="Tax calculators">
      <nav class="sidebar-primary" aria-label="Main navigation">
        <div class="calculator-menu">
          <button type="button" class="calculator-menu-toggle" data-nav="calculator" aria-expanded="false" aria-controls="calculator-menu-options">Calculators<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div id="calculator-menu-options" class="calculator-menu-content" hidden>
            <div class="calculator-search-bar"><label class="search"><span aria-hidden="true">⌕</span><input id="calculator-search" type="search" placeholder="Find a tax…" aria-label="Find a calculator"></label></div>
            <div id="calculator-nav"></div>
          </div>
        </div>
        <a href="#coverage" data-nav="coverage">Tax coverage</a>
        <a href="#law" data-nav="law">The tax law</a>
      </nav>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <button id="scroll-to-top" class="scroll-to-top" type="button" aria-label="Scroll to top" title="Scroll to top" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 12 6-6 6 6M12 6v14"/></svg></button>
  <footer><span>NTaxer · Independent tax planning tool</span><span>Estimates, not a tax assessment. Check the scope and sources for your case.</span></footer>
  <noscript><p class="notice">Enable JavaScript to use the calculators. <a href="https://nass.gov.ng/documents/download/11249">Read the Nigeria Tax Act 2025.</a></p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
